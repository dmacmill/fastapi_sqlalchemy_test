services:
  fastapi:
    image: "fastapisqlalchemy:latest"
    volumes:
     - ./.env:/app/.env
    ports:
    - 8000:8000
    depends_on:
      - db


  db:
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    env_file:
      - .env
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: