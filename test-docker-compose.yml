services:
  fastapi:
    build:
      context: .
    image: "fastapisqlalchemy:latest"
    volumes:
     - ./test.env:/app/test.env
     - ./app:/app/app
    environment:
      - TESTING=true
    ports:
    - 8000:8000
    depends_on:
      - db
    networks:
      - fastapi_network


  db:
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    env_file:
      - test.env
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastapi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 60s
      retries: 20


volumes:
  postgres_data:

networks:
  fastapi_network: