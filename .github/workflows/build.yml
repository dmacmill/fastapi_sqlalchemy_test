name: Build FastAPI App with Docker Compose

on:
  push:
    branches:
      - main
      - dm-update-ver
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Compose services
      run: docker compose -f test-docker-compose.yml build

    - name: Run containers (in detached mode)
      run: docker compose -f test-docker-compose.yml up -d

    - name: Wait for app to be ready
      run: |
        echo "Waiting for FastAPI app to be ready..."
        for i in {1..30}; do
          echo "Attempt $i of 30..."
          if curl -sSf http://localhost:8000/docs > /dev/null 2>&1; then
            echo "✓ App is ready!"
            exit 0
          fi
          if [ $i -eq 30 ]; then
            echo "✗ App failed to start after 30 attempts"
            echo ""
            echo "Container logs for debugging:"
            docker compose -f test-docker-compose.yml logs
            exit 1
          fi
          sleep 2
        done

    - name: Run tests (if any)
      run: |
        # run the tests
        docker exec fastapi_sqlalchemy_test-fastapi-1 pytest app/test -v --maxfail=1

        # View container logs for debugging
          docker compose -f test-docker-compose.yml logs

    - name: Stop and clean up containers
      if: always()
      run: docker compose -f test-docker-compose.yml down