name: Build FastAPI App with Docker Compose

on:
  push:
    branches:
      - main
      - dm-update-ver
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Compose services
      run: docker compose -f test-docker-compose.yml build

    - name: Run database container (in detached mode)
      run: docker compose -f test-docker-compose.yml up -d db

    - name: Wait for db to be ready then run fastapi
      run: |
        # getting db container id
        db_id=$(docker compose -f test-docker-compose.yml ps -q db)
        if [ -z "$db_id" ];then
          echo "Failed to get db container ID :<"
          docker compose -f test-docker-compose.yml logs db || true
          exit 1
        fi

        # wait for health to become "healthy" (60s total by default)
        for i in $(seq 1 60); do
          status=$(docker inspect --format='{{.State.Health.Status}}' "$container_id" 2>/dev/null || echo "no_health")
          if [ "$status" = "healthy" ]; then
            echo "db is healthy"
            break
          fi
          echo "Waiting for db health ($i/60) status=$status"
          if [ "$i" -eq 60 ]; then
            echo "DB did not become healthy in time"
            docker compose -f test-docker-compose.yml logs db
            exit 1
          fi
          sleep 1
        done

        # then run fastapi
        docker compose -f test-docker-compose.yml up -d --no-deps fastapi

    - name: Run tests (if any)
      run: |
        # run the tests
        docker exec fastapi_sqlalchemy_test-fastapi-1 pytest app/test -v --maxfail=1

        # View container logs for debugging
        docker compose -f test-docker-compose.yml logs

    - name: Stop and clean up containers
      if: always()
      run: docker compose -f test-docker-compose.yml down