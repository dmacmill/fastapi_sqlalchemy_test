name: Build FastAPI App with Docker Compose

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Compose services
      run: docker compose -f test-docker-compose.yml build

    - name: Run containers (in detached mode)
      run: docker compose -f test-docker-compose.yml up -d

    - name: Wait for app to be ready
      run: |
        # check if container is running
        docker ps | grep fastapi_sqlalchemy_test-fastapi-1 || docker ps -a | grep fastapi_sqlalchemy_test-fastapi-1

        # View container logs for debugging
        docker compose -f test-docker-compose.yml logs

        # give some time for startup
        for i in {1..20}; do
          curl -sSf http://localhost:8000 && break || sleep 3
        done

    - name: Run tests (if any)
      run: |
        # run the tests
        docker exec fastapi_sqlalchemy_test-fastapi-1 pytest app/test -v --maxfail=1
        
        # View container logs for debugging
          docker compose -f test-docker-compose.yml logs

    - name: Stop and clean up containers
      if: always()
      run: docker compose -f test-docker-compose.yml down